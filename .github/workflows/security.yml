name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Tuesdays 04:30 UTC: catch new advisories on dependencies even when no
    # PR has been opened.
    - cron: "30 4 * * 2"

permissions:
  contents: read
  security-events: write

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  osv-scanner:
    name: SCA (osv-scanner)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Run osv-scanner
        # `--skip-git` was removed in osv-scanner v2.x. Default behavior
        # already scans only the lockfile we pass via --lockfile.
        uses: google/osv-scanner-action/osv-scanner-action@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
        with:
          scan-args: |-
            --recursive
            --lockfile=package-lock.json
            ./

  npm-audit:
    name: npm audit (production)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm

      - name: Install
        run: npm ci

      # Production-only audit on each workspace. --audit-level=high makes us
      # fail on high/critical advisories but tolerate moderate noise that
      # Dependabot will resolve weekly.
      - name: Audit backend (production deps)
        run: npm audit --workspace backend --omit=dev --audit-level=high

      - name: Audit frontend (production deps)
        run: npm audit --workspace frontend --omit=dev --audit-level=high

      # Validate that every dependency in the lockfile carries a valid
      # registry signature. Catches package-tampering / typosquats that
      # have a forged manifest but invalid signature. Fails the build on
      # any unsigned or invalid-signature entry — npm registry signs
      # every package since 2023, so the invariant is "every dep
      # verifies" not "best effort".
      - name: Verify package signatures (full lockfile)
        run: npm audit signatures

  dependency-review:
    # Diff-scoped supply-chain gate: blocks a PR the moment it introduces
    # a new dependency with a known high/critical advisory or a license
    # outside the allowlist. Complements osv-scanner / npm-audit (which
    # look at the lockfile state) by catching the *delta* before it lands,
    # so a vulnerable package never reaches main even transiently.
    name: Dependency review (PR diff)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
          # Permissive list — covers the OSI-compatible licenses we
          # already depend on transitively. Tighten as we eliminate
          # outliers (e.g. drop CC0-1.0 once nothing in the tree needs it).
          allow-licenses: >-
            MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, 0BSD,
            CC-BY-4.0, CC0-1.0, Unlicense, MPL-2.0, Python-2.0,
            BlueOak-1.0.0, WTFPL
