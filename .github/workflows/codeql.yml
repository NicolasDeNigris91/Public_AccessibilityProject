name: CodeQL

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]

    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # Per-language config selection: javascript-typescript pulls
          # the project's full query selection (security-and-quality +
          # security-extended + custom euthus queries) from the
          # version-controlled config file. The `actions` analyzer has
          # no codebase-specific custom queries, so it sticks with the
          # default suite via the inline `queries` selection.
          config-file: ${{ matrix.language == 'javascript-typescript' && './.github/codeql/codeql-config.yml' || '' }}
          queries: ${{ matrix.language == 'actions' && 'security-and-quality' || '' }}

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
