name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: Hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Prettier check
        run: npm run format:check

      - name: Commitlint (PR title + commits)
        if: github.event_name == 'pull_request'
        run: |
          npx commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}" --verbose

  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      # mongodb-memory-server downloads the mongod binary (~780 MB) on first
      # use. Cache it so repeat runs skip the download entirely.
      - name: Cache mongodb-memory-server binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-memory-server-${{ runner.os }}

      - name: Typecheck
        run: npx tsc --noEmit
        working-directory: backend

      - name: Lint
        run: npm run lint --workspace backend

      - name: Test
        run: npm test --workspace backend

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit
        working-directory: frontend

      - name: Lint
        run: npm run lint --workspace frontend

      - name: Test
        run: npm test --workspace frontend

      - name: Build
        run: npm run build --workspace frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000
